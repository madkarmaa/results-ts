name: Bug report
description: Something isn't working as expected
title: 'bug: '
labels:
    - bug

body:
    - type: textarea
      id: bug_description
      attributes:
          label: What happened?
          description: Describe the unexpected behavior.
          placeholder: Describe the unexpected behavior.
      validations:
          required: true

    - type: textarea
      id: expected_behavior
      attributes:
          label: What did you expect?
          description: Describe what you expected to happen.
          placeholder: Describe what you expected to happen.
      validations:
          required: true

    - type: textarea
      id: reproduction_steps
      attributes:
          label: 'Short code snippet to reproduce the issue'
          description: Include the imports and setup needed to run the example.
          render: typescript
      validations:
          required: true

    - type: input
      id: library_version
      attributes:
          label: 'Library version'
          description: Enter the installed results-ts version.
          placeholder: '1.0.0'
      validations:
          required: true

    - type: input
      id: node_version
      attributes:
          label: 'Node.js version'
          description: 'Run `node -v` to get the version.'
          placeholder: '1.0.0'
      validations:
          required: true

    - type: input
      id: typescript_version
      attributes:
          label: 'TypeScript version'
          description: 'Run `tsc -v` to get the version.'
          placeholder: '1.0.0'
      validations:
          required: true

    - type: input
      id: bun_version
      attributes:
          label: 'Bun version'
          description: 'Run `bun -v` to get the version.'
          placeholder: '1.0.0'
